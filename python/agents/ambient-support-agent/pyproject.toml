[project]
name = "ambient-support-agent"
version = "0.1.0"
description = "An ambient agent that processes incoming support tickets via Pub/Sub and Cloud Scheduler triggers, classifying priority and routing to the right team."
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "google-adk>=1.29.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4.6",
    "mypy>=1.19.0",
    "codespell>=2.4.1",
]

[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["support_agent"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_subclassing_any = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
follow_imports = "silent"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc", "no-untyped-call", "no-any-return"]
exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["support_agent"]

[tool.agent-starter-pack]
base_template = "adk_base"
example_question = "Triage this ticket: Cannot login, getting 500 error for 2 hours"
deployment_targets = ["cloud_run"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
